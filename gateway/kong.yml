# ==============================================================================
# PROJECT SENTINEL - DEVSECOPS KONG API GATEWAY DECLARATIVE CONFIGURATION
# Mode: DB-less (KONG_DATABASE=off)
# Architecture: Option A - Service Pre-Function Zero Trust Policy Enforcement
# Target Service: OWASP Juice Shop (http://web:3000)
# ==============================================================================

_format_version: "3.0"
_transform: true

# ------------------------------------------------------------------------------
# 1. SERVICES & BACKEND UPSTREAM CONFIGURATION
# ------------------------------------------------------------------------------
services:
  - name: juice-shop-service
    # Service upstream details inside isolated Docker bridge network
    host: web
    port: 3000
    protocol: http
    # Common Timeouts (in milliseconds) to prevent connection pool exhaustion
    connect_timeout: 5000  # 5 seconds connection setup timeout
    read_timeout: 5000     # 5 seconds response read timeout
    write_timeout: 5000    # 5 seconds client request write timeout

    # Service-Level Plugins applied to ALL traffic through Gateway
    plugins:
      # Global Request Payload Size Limiting (Protects backend from oversized uploads/DoS)
      - name: request-size-limiting
        config:
          allowed_payload_size: 1  # 1 megabyte (MB) maximum payload size limit

      # Service-Level Pre-Function: Option A Zero Trust Enforcement Policy
      # Rules:
      #   1. If request contains x-api-key / apikey header:
      #      a. Verify Key Validity: Must match ${AGENT_API_KEY} environment secret.
      #         If key is INVALID -> Rejects with 401 Unauthorized across ALL routes.
      #      b. Verify Route Scope: Must match allowed agent endpoints (/api/Quantitys, /rest/products/search, /rest/user/login).
      #         If path is NOT allowed -> Rejects with 403 Forbidden.
      #   2. If x-api-key header is MISSING -> Allows public guest traffic to proceed.
      - name: pre-function
        config:
          access:
            - |
              local key = kong.request.get_header("x-api-key") or kong.request.get_header("apikey")
              if key and key ~= "" then
                local valid_key = "${AGENT_API_KEY}"
                if key ~= valid_key then
                  return kong.response.exit(401, { message = "Invalid authentication credentials" })
                end

                local path = kong.request.get_path()
                local allowed_paths = {
                  ["/api/Quantitys"] = true,
                  ["/rest/products/search"] = true,
                  ["/rest/user/login"] = true
                }

                if not allowed_paths[path] then
                  return kong.response.exit(403, { message = "You cannot consume this service" })
                end
              end

    # --------------------------------------------------------------------------
    # 2. ROUTES & ACCESS CONTROL DEFINITIONS
    # --------------------------------------------------------------------------
    routes:
      # ------------------------------------------------------------------------
      # Route 1: AI Security Agent Allowed Route
      # Purpose: Dedicated route for AI Agent scanner requests containing x-api-key
      # ------------------------------------------------------------------------
      - name: agent-route
        paths:
          - /api/Quantitys
          - /rest/products/search
          - /rest/user/login
        methods:
          - GET
          - POST
          - OPTIONS
        headers:
          x-api-key:
            - "~.+"  # Matches requests containing x-api-key header
        strip_path: false
        plugins:
          # Strict Key-Auth Plugin: Authenticates consumer ai-agent
          - name: key-auth
            config:
              key_names:
                - x-api-key
                - apikey
              hide_credentials: true  # Redacts API Key before proxying to Juice Shop
          # ACL Plugin: Only allows AI Security Agent (agent-group)
          - name: acl
            config:
              allow:
                - agent-group
          # Dedicated Rate Limiting for AI Security Agent Scanner: 20 requests per minute
          - name: rate-limiting
            config:
              minute: 20
              policy: local

      # ------------------------------------------------------------------------
      # Route 2: Guest Allowed Route (For Visitors WITHOUT x-api-key)
      # Purpose: Publicly accessible endpoints for unauthenticated users
      # ------------------------------------------------------------------------
      - name: guest-route
        paths:
          - /api/Quantitys
          - /rest/products/search
          - /rest/admin/application-version
          - /rest/user/login
          - /rest/user/reset-password
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
        plugins:
          # Rate Limiting for Guest Users: 60 requests per minute
          - name: rate-limiting
            config:
              minute: 60
              policy: local

      # ------------------------------------------------------------------------
      # Route 3: Guest Registration Route (POST-only for Visitors WITHOUT x-api-key)
      # Purpose: Restricts /api/Users and /api/SecurityAnswers to POST method
      # ------------------------------------------------------------------------
      - name: guest-register-route
        paths:
          - /api/Users
          - /api/SecurityAnswers
        methods:
          - POST
          - OPTIONS
        strip_path: false
        plugins:
          # Rate Limiting for Guest Registration: 20 requests per minute (Anti-Spam)
          - name: rate-limiting
            config:
              minute: 20
              policy: local

      # ------------------------------------------------------------------------
      # Route 4: Logged-in User Allowed Route
      # Purpose: Authenticated user endpoints requiring Authorization Bearer header
      # ------------------------------------------------------------------------
      - name: user-route
        paths:
          - /api/Quantitys
          - /rest/products/search
          - /rest/basket
          - /api/BasketItems
          - /rest/user/whoami
          - /profile/image/file
          - /rest/order-history
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        headers:
          authorization:
            - "~^Bearer "  # Enforces presence of Authorization Bearer JWT header
        strip_path: false
        plugins:
          # Rate Limiting for Authenticated Users: 100 requests per minute
          - name: rate-limiting
            config:
              minute: 100
              policy: local

      # ------------------------------------------------------------------------
      # Route 5: Static Frontend Assets Route (Catch-all Fallback for Web Visitors)
      # Purpose: Serves Single Page Application HTML/CSS/JS frontend bundles
      # ------------------------------------------------------------------------
      - name: static-route
        paths:
          - /
        methods:
          - GET
          - POST
          - HEAD
          - OPTIONS
        strip_path: false

# ------------------------------------------------------------------------------
# 3. CONSUMERS & CREDENTIALS DEFINITIONS
# ------------------------------------------------------------------------------
consumers:
  # AI Security Agent Consumer
  - username: ai-agent
    keyauth_credentials:
      # Dynamic secret resolved from environment variable via declarative env substitution (NO hardcoded key in repo)
      - key: "${AGENT_API_KEY}"
    acls:
      - group: agent-group

  # Anonymous / Unauthenticated User Consumer Fallback
  - username: anonymous-user
    acls:
      - group: guest-group
