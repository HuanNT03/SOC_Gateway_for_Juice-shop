# ==============================================================================
# PROJECT SENTINEL - DOCKER COMPOSE ORCHESTRATION
# Architecture: Kong API Gateway (Port 8000) + OWASP Juice Shop (Isolated Network)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. OWASP JUICE SHOP WEB APPLICATION (ISOLATED BACKEND)
  # ----------------------------------------------------------------------------
  web:
    image: bkimminich/juice-shop:v20.1.1
    container_name: sentinel-juice-shop
    restart: unless-stopped
    # Port 3000 is intentionally NOT mapped to host to enforce 100% Gateway Isolation!
    environment:
      - NODE_ENV=production
    healthcheck:
      # Health Check: Juice Shop v20.1.1 is a DISTROLESS image (no /bin/sh, wget, curl)
      # Must use CMD form (not CMD-SHELL) with Node.js binary directly
      # Node.js http.get checks if server responds with HTTP 200 on root path
      test: ["CMD", "/nodejs/bin/node", "-e", "require('http').get('http://localhost:3000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s    # Check every 15 seconds
      timeout: 5s      # Maximum wait time per health check attempt
      retries: 5       # Mark unhealthy after 5 consecutive failures
      start_period: 45s  # Grace period for Juice Shop SQLite database initialization
    networks:
      - sentinel-network

  # ----------------------------------------------------------------------------
  # 2. KONG API GATEWAY (DB-LESS DECLARATIVE MODE)
  # ----------------------------------------------------------------------------
  gateway:
    image: kong:3.6
    container_name: sentinel-kong-gateway
    restart: unless-stopped
    env_file:
      - .env
    command: /bin/sh -c "sed \"s/\\\$$\{AGENT_API_KEY\}/$${AGENT_API_KEY}/g\" /usr/local/kong/declarative/kong.yml > /tmp/kong.yml && exec /docker-entrypoint.sh kong docker-start"
    environment:
      # DB-less Mode Configuration
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      # Explicitly force Kong to use Docker internal DNS Server (127.0.0.11)
      KONG_DNS_RESOLVER: "127.0.0.11"
      # CRITICAL FIX for Docker + Ubuntu systemd-resolved (127.0.53.53 issue):
      # Docker internal DNS does NOT support SRV records. Kong default order includes SRV first,
      # causing SRV queries to fall back to host systemd-resolved which returns 127.0.53.53.
      # Setting KONG_DNS_ORDER to 'A,CNAME' skips SRV queries and resolves 'web' to container IP directly.
      KONG_DNS_ORDER: "A,CNAME"
      # Enable Environment Variable Substitution in DB-less Declarative Config
      KONG_DECLARATIVE_CONFIG_ENV_SUBST: "on"
      AGENT_API_KEY: ${AGENT_API_KEY:-sentinel-agent-secure-key-2026}
      # Standard Logging & Listening Ports
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    volumes:
      # Mount declarative configuration file
      - ./gateway/kong.yml:/usr/local/kong/declarative/kong.yml:ro
    ports:
      # Port 8000: Kong Proxy (Public Entry Point)
      - "8000:8000"
      # Port 8001: Kong Admin API (DevSecOps Management)
      - "8001:8001"
    depends_on:
      - web
    networks:
      - sentinel-network

networks:
  sentinel-network:
    name: sentinel-network
    driver: bridge
