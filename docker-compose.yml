services:
  web:
    image: bkimminich/juice-shop:v20.1.1
    container_name: sentinel-juice-shop
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - sentinel-network

networks:
  sentinel-network:
    name: sentinel-network
    driver: bridge
